<!doctype html>
<html><head><meta charset="utf-8"><title>epox 3D logo lab</title>
<style>html,body{margin:0;background:#0B0C0F;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
/*
 * Option lab for a real-3D epox wordmark (prototype only, not shipped). Same scene, four material directions:
 *  A chrome   · polished chrome, studio reflections in ice / mint / white
 *  B liquid   · chrome whose surface ripples and flows (animated normal field)
 *  C glass    · holographic glass: clear letters that refract the foil behind them, with thin-film iridescence
 *  D holo     · iridescent metal: the holo-foil rainbow as a real thin-film coating on metal
 * Driven by render.js: window.ready, then window.renderAt(t) with t in [0,1) for a seamless loop.
 */
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const params = new URLSearchParams(location.search);
const V = params.get('v') || 'A';
const W = +params.get('w') || 960, H = +params.get('h') || 540;
const PATH = decodeURIComponent(params.get('d') || '');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = V === 'C' ? 1.15 : 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0B0C0F');
const camera = new THREE.PerspectiveCamera(28, W / H, 10, 10000); camera.position.set(0, 0, 2300);

// studio environment: soft panels in the Ice Mint stops on a dark room (becomes the reflection map)
const env = new THREE.Scene(); env.background = new THREE.Color('#05060a');
const panel = (color, w, h, pos, rot, intensity = 1) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
  m.position.set(...pos); m.rotation.set(...rot); env.add(m);
};
// in front of the letters (behind the camera, +z), where their flat faces look: a big white softbox overhead,
// mint and ice-blue softboxes left and right, and a thin bright strip low, so the faces read bright with colour
{ // banded softbox overhead: bright bands with dark gaps, tinted through the Ice Mint stops, so flat faces show a sweep
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512; const x = cv.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, 512, 512);
  [['#FFFFFF', 0, 120], ['#E4FBFF', 150, 70], ['#7FF5D0', 250, 60], ['#8FC9FF', 340, 70], ['#E2FFF4', 440, 40]].forEach(([c, y, h]) => { x.fillStyle = c; x.fillRect(0, y, 512, h); });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), new THREE.MeshBasicMaterial({ map: t, color: new THREE.Color(2.4, 2.4, 2.4), side: THREE.DoubleSide }));
  m.position.set(0, 1.5, 5); m.rotation.set(-0.35, 0, 0); m.lookAt(0, 0, 0); env.add(m); }
panel('#7FF5D0', 3.5, 6, [-5, 0, 4], [0, Math.PI / 3, 0], 1.7);
panel('#8FC9FF', 3.5, 6, [5, 0.4, 4], [0, -Math.PI / 3, 0], 1.9);
panel('#E4FBFF', 10, 0.5, [0, -2.2, 5], [Math.PI / 5, 0, 0], 2.6);
// behind and to the sides, for the bevels and the side walls
panel('#BFE3FF', 9, 0.8, [0, 2.5, -5], [Math.PI / 3, 0, 0], 2.0);
panel('#A8F0E0', 0.8, 6, [-6, 0, -2], [0, Math.PI / 2, 0], 1.5);
panel('#E2FFF4', 0.8, 6, [6, 0, -2], [0, -Math.PI / 2, 0], 1.5);
// soft room fill so nothing reflects pure black
const dome = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'varying vec3 p; void main(){ float t = p.y*0.5+0.5; gl_FragColor = vec4(mix(vec3(0.05,0.06,0.08), vec3(0.22,0.26,0.30), t), 1.); }' }));
env.add(dome);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(env, 0.035).texture;

// the wordmark: brand path → shapes → bevelled extrusion, centred
const svg = `<svg xmlns="http://www.w3.org/2000/svg"><path d="${PATH}"/></svg>`;
const shapes = new SVGLoader().parse(svg).paths.flatMap(p => SVGLoader.createShapes(p));
const geo = mergeGeometries(shapes.map(s => new THREE.ExtrudeGeometry(s, {
  depth: 70, curveSegments: 24, bevelEnabled: true, bevelThickness: 16, bevelSize: 9, bevelSegments: 10,
})));
geo.scale(1, -1, 1); geo.computeBoundingBox(); const bb = geo.boundingBox; const c = new THREE.Vector3(); bb.getCenter(c);
geo.translate(-c.x, -c.y, -c.z); geo.computeVertexNormals();

let mat;
const uTime = { value: 0 };
if (V === 'A' || V === 'B') {
  mat = new THREE.MeshPhysicalMaterial({ color: '#E8EEF4', metalness: 1, roughness: 0.07, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.25 });
}
if (V === 'B') {
  // liquid: a flowing 3D noise field bends the shading normal, so reflections ripple and pour across the letters
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vObj; uniform float uTime;
      vec3 h3(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(vec3(p.x*p.y*p.z, p.x+p.y*p.z, p.y*p.x+p.z)) * 2. - 1.; }
      float n3(vec3 x){ vec3 i=floor(x), f=fract(x); vec3 u=f*f*(3.-2.*f);
        return mix(mix(mix(dot(h3(i),f), dot(h3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x), mix(dot(h3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(h3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(h3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(h3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x), mix(dot(h3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(h3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      { float a = uTime * 6.2831853; vec3 q = vObj * 0.0042 + vec3(cos(a), sin(a), 0.) * 0.9;
        float e = 0.05; float b = n3(q);
        vec3 g = vec3(n3(q+vec3(e,0,0))-b, n3(q+vec3(0,e,0))-b, n3(q+vec3(0,0,e))-b) / e;
        normal = normalize(normal + g * 0.32); }`);
  };
}
if (V === 'C') {
  mat = new THREE.MeshPhysicalMaterial({ color: '#F2FBFF', metalness: 0, roughness: 0.04, transmission: 1, thickness: 70, ior: 1.45,
    iridescence: 1, iridescenceIOR: 1.35, iridescenceThicknessRange: [150, 700], envMapIntensity: 1.4, clearcoat: 1, clearcoatRoughness: 0.03, attenuationColor: '#BFE3FF', attenuationDistance: 900 });
  // something for the glass to bend: the three foil bars, blurred, behind the letters
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1024, 512); [['0', '#BFE3FF'], ['.2', '#E2FFF4'], ['.4', '#8FC9FF'], ['.58', '#7FF5D0'], ['.78', '#E4FBFF'], ['1', '#A8F0E0']].forEach(([o, c]) => g.addColorStop(+o, c));
  x.fillStyle = '#0B0C0F'; x.fillRect(0, 0, 1024, 512); x.fillStyle = g; x.filter = 'blur(6px)';
  [[150, 70], [120, 210], [90, 350]].forEach(([l, y]) => { x.beginPath(); x.moveTo(l + 40, y); x.lineTo(1024, y); x.lineTo(1024, y + 90); x.lineTo(l, y + 90); x.fill(); });
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(2600, 1300), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })); back.position.set(+(params.get('bx') ?? 420), +(params.get('by') ?? 10), -900); back.scale.setScalar(+(params.get('bs') ?? 1.15)); scene.add(back);
}
if (V === 'D') {
  mat = new THREE.MeshPhysicalMaterial({ color: '#FFFFFF', metalness: 1, roughness: 0.1, envMapIntensity: 1.45, iridescence: 0.6, iridescenceIOR: 1.8, iridescenceThicknessRange: [200, 900] });
  // holo foil: the metal's own colour runs through the six Ice Mint stops across the letters and with the viewing
  // angle, so it shifts like real holographic foil as the logo turns
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vObj; uniform float uTime;
      vec3 foil(float t){ t = fract(t); vec3 c[6]; c[0]=vec3(.749,.890,1.); c[1]=vec3(.886,1.,.957); c[2]=vec3(.561,.788,1.); c[3]=vec3(.498,.961,.816); c[4]=vec3(.894,.984,1.); c[5]=vec3(.659,.941,.878);
        float s = t*6.; int i = int(floor(s)); float f = fract(s); vec3 a = c[0], b = c[1];
        for (int k = 0; k < 6; k++) { if (k == i) { a = c[k]; b = c[(k+1) - 6*((k+1)/6)]; } } return mix(a, b, f); }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      float holo = vObj.x * 0.0011 + vObj.y * 0.0006 + dot(normal, normalize(vViewPosition)) * 0.9 + uTime;
      diffuseColor.rgb *= foil(holo) * 1.08;`);
  };
}
const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);
const fit = +(params.get('fit') ?? (V === 'C' ? 0.6 : 0.66)) * (2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect) / (bb.max.x - bb.min.x);
mesh.scale.setScalar(fit);

// t in [0,1): a slow sway (as if a cursor drifts across) + B's flow; seamless at t = 1
window.renderAt = (t) => {
  const a = t * Math.PI * 2;
  const sw = +(params.get('sway') ?? 1); // loops for the site use a calmer sway than the option previews
  mesh.rotation.y = Math.sin(a) * 0.32 * sw; mesh.rotation.x = (Math.cos(a) * 0.12 - 0.04) * sw;
  uTime.value = t;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body></html>
